<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" width="680" height="500">
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="0.55" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="contrapeso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mastil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155"/><stop offset="0.5" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.9"/><stop offset="1" stop-color="#bae6fd" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="llanta" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e2e8f0"/><stop offset="0.6" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/>
    </radialGradient>
    <pattern id="banda" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#111827"/><rect width="3" height="6" fill="#1f2937"/>
    </pattern>
  </defs>

  <!-- piso y sombra -->
  <line x1="5" y1="232" x2="335" y2="232" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="170" cy="233" rx="140" ry="5" fill="#0f172a" opacity="0.12"/>

  <!-- palet en las horquillas -->
  <g>
    <rect x="12" y="184" width="74" height="8" rx="1" fill="#b45309"/>
    <rect x="12" y="198" width="74" height="6" rx="1" fill="#92400e"/>
    <rect x="14" y="192" width="10" height="6" fill="#78350f"/><rect x="44" y="192" width="10" height="6" fill="#78350f"/><rect x="74" y="192" width="10" height="6" fill="#78350f"/>
    <rect x="14" y="138" width="70" height="46" rx="2" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="14" y1="153" x2="84" y2="153" stroke="#93c5fd"/><line x1="14" y1="168" x2="84" y2="168" stroke="#93c5fd"/>
    <line x1="49" y1="138" x2="49" y2="184" stroke="#93c5fd"/>
  </g>

  <!-- horquillas -->
  <path d="M8 205 L96 205 L96 210 L10 210 Z" fill="#374151"/>
  <rect x="92" y="150" width="7" height="60" fill="#374151"/>

  <!-- respaldo de carga -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <rect x="96" y="112" width="12" height="40"/>
    <line x1="96" y1="122" x2="108" y2="122"/><line x1="96" y1="132" x2="108" y2="132"/><line x1="96" y1="142" x2="108" y2="142"/>
  </g>
  <!-- carro portahorquillas -->
  <rect x="99" y="146" width="14" height="22" rx="2" fill="#1f2937"/>

  <!-- mástil de dos tramos -->
  <rect x="110" y="40" width="10" height="182" rx="1.5" fill="url(#mastil)"/>
  <rect x="120" y="58" width="9" height="164" rx="1.5" fill="url(#mastil)" opacity="0.9"/>
  <rect x="108" y="40" width="23" height="6" rx="1" fill="#1e293b"/>
  <rect x="108" y="92" width="23" height="4" fill="#1e293b"/>
  <rect x="108" y="150" width="23" height="4" fill="#1e293b"/>
  <!-- cadena y cilindro -->
  <line x1="115" y1="48" x2="115" y2="146" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <rect x="122.5" y="96" width="4" height="120" fill="#cbd5e1"/>
  <!-- cilindro de inclinación -->
  <line x1="129" y1="168" x2="150" y2="176" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <!-- techo protector y parantes -->
  <path d="M142 70 L150 66 L262 66 L266 70" fill="none" stroke="#1f2937" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#334155" stroke-width="1.5">
    <line x1="160" y1="66" x2="160" y2="70"/><line x1="180" y1="66" x2="180" y2="70"/><line x1="200" y1="66" x2="200" y2="70"/>
    <line x1="220" y1="66" x2="220" y2="70"/><line x1="240" y1="66" x2="240" y2="70"/>
  </g>
  <line x1="148" y1="68" x2="140" y2="170" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <line x1="258" y1="68" x2="246" y2="160" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <!-- vidrio delantero -->
  <path d="M149 74 L143 150 L150 150 L155 74 Z" fill="url(#vidrio)"/>
  <!-- baliza -->
  <rect x="226" y="58" width="12" height="8" rx="2" fill="#f97316"/>
  <rect x="229" y="55" width="6" height="4" rx="2" fill="#fdba74"/>

  <!-- asiento, volante y operario esquemático -->
  <path d="M206 150 L206 118 Q206 110 214 110 L222 110 Q228 110 228 118 L228 150 Z" fill="#111827"/>
  <rect x="200" y="146" width="34" height="8" rx="3" fill="#1f2937"/>
  <line x1="166" y1="146" x2="178" y2="118" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="180" cy="115" rx="9" ry="3" transform="rotate(-25 180 115)" fill="none" stroke="#111827" stroke-width="3"/>
  <!-- palancas -->
  <line x1="160" y1="150" x2="164" y2="128" stroke="#111827" stroke-width="2"/><circle cx="164" cy="127" r="2.5" fill="#dc2626"/>
  <line x1="155" y1="150" x2="158" y2="132" stroke="#111827" stroke-width="2"/><circle cx="158" cy="131" r="2.5" fill="#111827"/>

  <!-- carrocería -->
  <path d="M134 220 L134 168 Q134 152 150 152 L250 152 Q262 152 268 162 L278 182 L278 220 Z" fill="url(#cuerpo)" stroke="#b45309" stroke-width="1.5"/>
  <!-- contrapeso -->
  <path d="M262 150 Q300 150 308 178 L312 212 Q312 222 302 222 L268 222 L268 160 Z" fill="url(#contrapeso)"/>
  <circle cx="300" cy="172" r="3" fill="#fca5a5"/>
  <!-- detalles de carrocería -->
  <path d="M150 166 L246 166" stroke="#fde68a" stroke-width="2" opacity="0.8"/>
  <rect x="226" y="172" width="30" height="14" rx="2" fill="#d97706" opacity="0.6"/>
  <g stroke="#b45309" stroke-width="1"><line x1="229" y1="176" x2="253" y2="176"/><line x1="229" y1="180" x2="253" y2="180"/><line x1="229" y1="184" x2="253" y2="184"/></g>
  <rect x="140" y="160" width="10" height="5" rx="1" fill="#fef9c3" stroke="#a16207" stroke-width="0.8"/>
  <!-- escalón -->
  <rect x="192" y="210" width="30" height="5" rx="1" fill="#1f2937"/>

  <!-- guardabarros -->
  <path d="M138 218 Q138 182 172 182 Q206 182 206 218" fill="#1f2937"/>
  <path d="M248 218 Q248 192 272 192 Q296 192 296 218" fill="#1f2937"/>

  <!-- rueda delantera (motriz, más grande) -->
  <g>
    <circle cx="172" cy="210" r="22" fill="url(#banda)"/>
    <circle cx="172" cy="210" r="22" fill="none" stroke="#030712" stroke-width="1.5"/>
    <circle cx="172" cy="210" r="13" fill="url(#llanta)" stroke="#334155"/>
    <circle cx="172" cy="210" r="4" fill="#334155"/>
    <g fill="#475569"><circle cx="172" cy="202" r="1.5"/><circle cx="179" cy="207" r="1.5"/><circle cx="177" cy="216" r="1.5"/><circle cx="167" cy="216" r="1.5"/><circle cx="165" cy="207" r="1.5"/></g>
  </g>
  <!-- rueda trasera (de dirección) -->
  <g>
    <circle cx="272" cy="214" r="17" fill="url(#banda)"/>
    <circle cx="272" cy="214" r="17" fill="none" stroke="#030712" stroke-width="1.5"/>
    <circle cx="272" cy="214" r="10" fill="url(#llanta)" stroke="#334155"/>
    <circle cx="272" cy="214" r="3" fill="#334155"/>
  </g>
</svg>
